<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitud de Programas de Incentivos | Liverpool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --color-bg-page: #f5f5f7; /* Gris suave estilo Apple */
        --color-card-bg: #ffffff;
        --color-primary: #0066cc; /* Azul Apple/Google */
        --color-primary-hover: #0052a3;
        --color-text-main: #1d1d1f;
        --color-text-muted: #86868b;
        --color-border: #e5e5ea;
        --color-input-bg: #f8f9fa;
        --radius-card: 18px;
        --radius-input: 10px;
      }

      body { 
        background-color: var(--color-bg-page); 
        padding: 40px 15px; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        color: var(--color-text-main);
        -webkit-font-smoothing: antialiased;
      }

      .form-container { 
        background: var(--color-card-bg); 
        padding: 48px; 
        border-radius: var(--radius-card); 
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04); 
        max-width: 920px; 
        margin: 0 auto; 
        border: 1px solid var(--color-border);
      }

      .logo-container {
        text-align: center;
        margin-bottom: 24px;
      }
      .logo-container img {
        max-height: 42px;
        width: auto;
        object-fit: contain;
      }

      .main-title {
        font-weight: 700;
        font-size: 1.85rem;
        letter-spacing: -0.02em;
        color: var(--color-text-main);
      }

      .step-title { 
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--color-text-main);
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--color-border);
      }

      /* Etiquetas e Inputs limpios tipo Apple/Google */
      .form-label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #3a3a3c;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .form-control, .form-select {
        background-color: var(--color-input-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-input);
        padding: 10px 14px;
        font-size: 0.95rem;
        color: var(--color-text-main);
        transition: all 0.2s ease;
      }

      .form-control:focus, .form-select:focus {
        background-color: #ffffff;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.12);
        outline: none;
      }

      .badge-optional {
        font-size: 0.725rem;
        font-weight: 500;
        background-color: #e9ecef;
        color: #6c757d;
        padding: 2px 8px;
        border-radius: 12px;
      }

      /* Alineación perfecta en rejillas */
      .field-group {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      /* Estilo para tablas con scroll */
      .tabla-scroll-container {
        max-height: 360px;
        overflow-y: auto;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-input);
      }

      .table {
        margin-bottom: 0;
        font-size: 0.9rem;
      }

      .table thead th {
        background-color: #f2f2f7 !important;
        color: #48484a;
        font-weight: 600;
        border-bottom: 1px solid var(--color-border);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .btn-custom { 
        background-color: var(--color-primary); 
        color: white; 
        font-weight: 600;
        border-radius: var(--radius-input);
        padding: 14px 24px;
        border: none;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      .btn-custom:hover { 
        background-color: var(--color-primary-hover); 
        color: white; 
      }

      .btn-custom:active {
        transform: scale(0.99);
      }

      .card-lineamientos {
        background-color: #f8f9fa;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-input);
      }
    </style>
  </head>
  <body>

    <div class="form-container">
      
      <div class="logo-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/El_Puerto_de_Liverpool_%28group%29_logo.png" alt="El Puerto de Liverpool">
      </div>

      <h2 class="text-center main-title mb-5">Solicitud de Programa de Incentivos</h2>
      
      <form id="incentivosForm">
        
        <!-- Sección 1 -->
        <div class="mb-5">
          <h4 class="step-title">1. Datos del Solicitante y Programa</h4>
          <div class="row g-3">
            <div class="col-md-6 field-group">
              <label class="form-label">Nombre del Solicitante</label>
              <input type="text" class="form-control" id="nombreVendedor" required>
            </div>
            <div class="col-md-6 field-group">
              <label class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-12 field-group">
              <label class="form-label">Nombre del Programa de Incentivos</label>
              <input type="text" class="form-control" id="nombrePrograma" required>
            </div>
            <div class="col-md-6 field-group">
              <label class="form-label">Fecha de Inicio del Programa</label>
              <input type="date" class="form-control" id="fechaInicio" required>
            </div>
            <div class="col-md-6 field-group">
              <label class="form-label">Fecha de Fin del Programa</label>
              <input type="date" class="form-control" id="fechaFin" required>
            </div>
          </div>
        </div>

        <!-- Sección 2 -->
        <div class="mb-5">
          <h4 class="step-title">2. Clasificación y Comprador Responsable</h4>
          <div class="row g-3">
            <div class="col-md-4 field-group">
              <label class="form-label">Origen del Proveedor</label>
              <select class="form-select" id="origenProveedor">
                <option value="Nacional">Nacional</option>
                <option value="Extranjero">Extranjero</option>
              </select>
            </div>
            <div class="col-md-3 field-group">
              <label class="form-label">No. Proveedor</label>
              <input type="text" class="form-control" id="numProveedor" required>
            </div>
            <div class="col-md-5 field-group">
              <label class="form-label">Nombre del Proveedor</label>
              <input type="text" class="form-control" id="nomProveedor" required>
            </div>
            <div class="col-md-3 field-group">
              <label class="form-label">No. Marca</label>
              <input type="text" class="form-control" id="numMarca" required>
            </div>
            <div class="col-md-9 field-group">
              <label class="form-label">Nombre de la Marca Participante</label>
              <input type="text" class="form-control" id="nomMarca" required>
            </div>
            <div class="col-md-3 field-group">
              <label class="form-label">No. Sección</label>
              <input type="text" class="form-control" id="numSeccion" required>
            </div>
            <div class="col-md-9 field-group">
              <label class="form-label">Nombre de la Sección</label>
              <input type="text" class="form-control" id="nomSeccion" required>
            </div>
            <div class="col-md-6 field-group">
              <label class="form-label">Comprador Responsable</label>
              <input type="text" class="form-control" id="nombreComprador" placeholder="Nombre completo" required>
            </div>
            <div class="col-md-6 field-group">
              <label class="form-label">Correo del Comprador Responsable</label>
              <input type="email" class="form-control" id="emailComprador" placeholder="ejemplo@liverpool.com.mx" required>
            </div>
          </div>
        </div>

        <!-- Sección 3: Alineación Perfecta de Campos (Corregida) -->
        <div class="mb-5">
          <h4 class="step-title">3. Logística, Presupuesto y Mecánica</h4>
          <div class="row g-3">
            <div class="col-md-4 field-group">
              <label class="form-label">Público Dirigido</label>
              <select class="form-select" id="publicoDirigido">
                <option value="Vendedores">Vendedores</option>
                <option value="Jefes de Departamento">Jefes de Departamento</option>
                <option value="Ambos (Vendedores y Jefes)">Ambos (Vendedores y Jefes)</option>
                <option value="Otros">Otros</option>
              </select>
            </div>

            <!-- Campo Opcional con Badge sin romper alineación -->
            <div class="col-md-4 field-group">
              <label class="form-label">
                <span>Envío de Premios</span>
                <span class="badge-optional">Opcional</span>
              </label>
              <input type="date" class="form-control" id="fechaEnvioPremios">
            </div>

            <div class="col-md-4 field-group">
              <label class="form-label">Centro de Costes</label>
              <input type="text" class="form-control" id="centroCostes" required>
            </div>

            <div class="col-md-6 field-group">
              <label class="form-label">Tipo de Incentivo</label>
              <select class="form-select" id="tipoIncentivo">
                <option value="Especie">Especie</option>
                <option value="Efectivo">Efectivo</option>
                <option value="Vale Incentivo">Vale Incentivo</option>
              </select>
            </div>

            <div class="col-md-6 field-group">
              <label class="form-label">Valor Aprox. de Premios ($MXN)</label>
              <input type="number" class="form-control" id="valorPremios" required>
            </div>

            <div class="col-12 field-group">
              <label class="form-label">Objetivo del Programa</label>
              <textarea class="form-control" id="objetivo" rows="2" required></textarea>
            </div>

            <div class="col-12 field-group">
              <label class="form-label">Mecánica del Programa (Descripción)</label>
              <textarea class="form-control" id="mecanica" rows="3" required></textarea>
            </div>
          </div>
        </div>

        <button type="button" id="btnEnviar" class="btn btn-custom w-100 fs-6" onclick="alert('Formulario actualizado con éxito.')">Enviar Solicitud Completa</button>
      </form>
    </div>

  </body>
</html>
